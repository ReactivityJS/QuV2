<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="QUniverse - a Qu-based ecosystem of apps that share one identity, one connection, one nav." />
  <meta name="theme-color" content="#5b5bd6" />
  <link rel="manifest" id="qu-manifest-link" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <title>QUniverse</title>
  <style>
    :root { color-scheme: light dark; }
    /* A bounded height chain from html all the way to .qu-shell-screen -
       without it, "height: 100%" (used by apps/chat's own root, so its
       message list can be an internally-scrolling region with a
       sticky-pinned composer) resolves against an unconstrained ancestor
       and collapses to the content's natural height instead, silently
       turning "scroll inside the message list" into "scroll the whole
       page" (no error, just the wrong element moves). screenEl itself
       becomes the actual scroll container (overflow-y: auto) rather than
       the body, which every OTHER app keeps working with unchanged - a
       page whose content is taller than the available space still
       scrolls exactly as before, just with the header staying pinned
       instead of scrolling away with it. The header's own position:
       sticky (from the header-pinning feature) is harmless-but-inert
       now that body itself no longer scrolls - kept anyway since
       screenEl's padding could theoretically still let content run
       under it in edge cases, and it costs nothing when idle. */
    html, body { height: 100%; }
    body { font-family: system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; }
    .qu-shell-header { display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1rem; border-bottom: 1px solid #8884; flex-shrink: 0; position: sticky; top: 0; z-index: 20; background: canvas; color: canvastext; }
    .qu-shell-history-btn { background: none; border: 1px solid #8884; border-radius: 0.3rem; cursor: pointer; font: inherit; line-height: 1; padding: 0.3rem 0.5rem; color: inherit; }
    .qu-shell-brand { display: inline-flex; text-decoration: none; color: inherit; }
    .qu-shell-spacer { flex: 1; }
    .qu-shell-id { display: inline-flex; align-items: center; gap: 0.4rem; opacity: 0.8; font-family: ui-monospace, monospace; font-size: 0.85em; text-decoration: none; color: inherit; }
    .qu-shell-id:hover { text-decoration: underline; }
    .qu-shell-update-btn { background: #5b5bd6; color: #fff; border: none; border-radius: 999px; cursor: pointer; font: inherit; font-size: 0.8em; line-height: 1; padding: 0.4rem 0.7rem; white-space: nowrap; }
    .qu-shell-update-btn:disabled { opacity: 0.6; cursor: default; }
    .qu-shell-lang { background: none; border: 1px solid #8884; border-radius: 0.3rem; cursor: pointer; font: inherit; font-size: 0.85em; line-height: 1; padding: 0.3rem 0.4rem; color: inherit; }
    .qu-shell-bell { position: relative; display: inline-flex; text-decoration: none; color: inherit; font-size: 1.1em; padding: 0.2rem; }
    .qu-shell-bell-badge { position: absolute; top: -0.3rem; right: -0.4rem; background: #c00; color: #fff; border-radius: 1rem; font-size: 0.6rem; line-height: 1; padding: 0.2rem 0.35rem; font-family: system-ui, sans-serif; }
    .qu-shell-screen { padding: 1rem; box-sizing: border-box; flex: 1; min-height: 0; overflow-y: auto; }
    .qu-shell-toolbar { display: flex; justify-content: flex-end; padding: 0.3rem 1rem 0; flex-shrink: 0; }
    .qu-shell-error { color: #c00; }

    /* Disclosure menu (header dropdown + per-app context menu, see menu.js) */
    .qu-menu { position: relative; }
    .qu-menu-button { list-style: none; cursor: pointer; user-select: none; border: 1px solid #8884; border-radius: 0.3rem; padding: 0.3rem 0.6rem; display: inline-block; }
    .qu-menu-button::-webkit-details-marker { display: none; }
    .qu-menu-panel { position: absolute; right: 0; top: calc(100% + 0.3rem); min-width: 12rem; display: flex; flex-direction: column; background: canvas; color: canvastext; border: 1px solid #8884; border-radius: 0.4rem; box-shadow: 0 0.3rem 1rem #0004; padding: 0.3rem; z-index: 10; }
    .qu-menu-item, .qu-menu-link { display: block; text-align: left; background: none; border: none; font: inherit; color: inherit; text-decoration: none; padding: 0.4rem 0.6rem; border-radius: 0.3rem; cursor: pointer; }
    .qu-menu-item:hover, .qu-menu-link:hover { background: #8882; }
    .qu-menu-sep { border: none; border-top: 1px solid #8884; margin: 0.3rem 0; }
    .qu-menu-empty { opacity: 0.6; font-size: 0.85em; padding: 0.4rem 0.6rem; }
    .qu-menu-fav-row { display: flex; align-items: center; }
    .qu-menu-fav-row .qu-menu-link { flex: 1; }
    .qu-menu-fav-toggle { background: none; border: none; cursor: pointer; padding: 0.4rem 0.5rem; }
  </style>
</head>
<body>
  <script type="module" src="/shell-bundle.js"></script>
</body>
</html>
