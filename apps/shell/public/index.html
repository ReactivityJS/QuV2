<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="QUniverse - a Qu-based ecosystem of apps that share one identity, one connection, one nav." />
  <title>QUniverse</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; }
    .qu-shell-header { display: flex; align-items: center; gap: 1rem; padding: 0.6rem 1rem; border-bottom: 1px solid #8884; }
    .qu-shell-brand { font-weight: 700; text-decoration: none; color: inherit; }
    .qu-shell-nav { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; flex: 1; }
    .qu-shell-nav-item { display: inline-flex; align-items: center; gap: 0.2rem; }
    .qu-shell-nav-link { text-decoration: none; color: inherit; }
    .qu-shell-fav-toggle { background: none; border: none; cursor: pointer; font-size: 0.9em; }
    .qu-shell-nav-sep { opacity: 0.4; }
    .qu-shell-id { opacity: 0.6; font-family: ui-monospace, monospace; font-size: 0.85em; }
    .qu-shell-screen { padding: 1rem; }
    .qu-shell-error { color: #c00; }
    .qu-shell-visibility-toggle { display: flex; align-items: center; gap: 0.4rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <script type="module" src="/shell-bundle.js"></script>
</body>
</html>
